<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc">
  <title id="title">Mini-SoC block diagram</title>
  <desc id="desc">A black and white diagram of the soc_top module with GPIO, timer, and UART transmitter peripherals.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#000"/>
    </marker>
    <style>
      .box { fill: #fff; stroke: #000; stroke-width: 2.5; }
      .outer { fill: #fff; stroke: #000; stroke-width: 3; }
      .line { fill: none; stroke: #000; stroke-width: 2.5; marker-end: url(#arrow); }
      .label { fill: #000; font-family: Arial, Helvetica, sans-serif; font-size: 21px; }
      .small { fill: #000; font-family: Arial, Helvetica, sans-serif; font-size: 17px; }
      .title { fill: #000; font-family: Arial, Helvetica, sans-serif; font-size: 30px; font-weight: bold; }
      .module { fill: #000; font-family: Arial, Helvetica, sans-serif; font-size: 22px; font-weight: bold; }
    </style>
  </defs>
  <rect x="0" y="0" width="1200" height="650" fill="#ffffff"/>


  <text x="600" y="42" text-anchor="middle" class="title">Mini-SoC Block Diagram</text>

  <rect x="330" y="115" width="540" height="455" rx="12" class="outer"/>
  <text x="600" y="150" text-anchor="middle" class="module">soc_top</text>

  <rect x="430" y="190" width="340" height="75" rx="6" class="box"/>
  <text x="600" y="222" text-anchor="middle" class="module">GPIO Peripheral</text>
  <text x="600" y="247" text-anchor="middle" class="small">8-bit input and output</text>

  <rect x="430" y="310" width="340" height="75" rx="6" class="box"/>
  <text x="600" y="342" text-anchor="middle" class="module">Timer Peripheral</text>
  <text x="600" y="367" text-anchor="middle" class="small">32-bit counter</text>

  <rect x="430" y="430" width="340" height="75" rx="6" class="box"/>
  <text x="600" y="462" text-anchor="middle" class="module">UART Transmitter</text>
  <text x="600" y="487" text-anchor="middle" class="small">8N1 serial output</text>

  <text x="600" y="87" text-anchor="middle" class="label">Clock + Reset</text>
  <path d="M600 96 L600 115" class="line"/>

  <text x="35" y="210" class="label">GPIO controls</text>
  <text x="35" y="243" class="label">GPIO inputs</text>
  <path d="M210 205 L430 205" class="line"/>
  <path d="M210 238 L430 238" class="line"/>

  <text x="35" y="335" class="label">Timer controls</text>
  <path d="M210 330 L430 330" class="line"/>

  <text x="35" y="455" class="label">UART start + data</text>
  <path d="M250 450 L430 450" class="line"/>

  <path d="M770 225 L1015 225" class="line"/>
  <text x="1030" y="232" class="label">gpio_out</text>

  <path d="M770 345 L1015 345" class="line"/>
  <text x="1030" y="352" class="label">timer_count</text>

  <path d="M770 462 L1015 462" class="line"/>
  <text x="1030" y="469" class="label">uart_tx</text>
  <path d="M770 495 L1015 495" class="line"/>
  <text x="1030" y="502" class="label">uart_busy</text>
</svg>
